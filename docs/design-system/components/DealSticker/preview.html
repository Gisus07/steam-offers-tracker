<!-- @dsCard group="Oferta" height=150 subtitle="sm · md · lg, y la entrada de una oferta nueva" -->
<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>DealSticker</title>
<script src="https://cdn.jsdelivr.net/npm/motion@14.3.0/dist/motion.js"></script></head>
<body class="ot-root">
<div class="ot-pad ot-col" id="root">
  <div class="ot-row" style="gap:28px;padding:10px 4px">
    <span class="ot-sticker ot-sticker--sm" aria-label="50 por ciento de descuento">−50%</span>
    <span class="ot-sticker" aria-label="85 por ciento de descuento">−85%</span>
    <span class="ot-sticker ot-sticker--lg" id="big" aria-label="93 por ciento de descuento">−93%</span>
  </div>
  <div><button class="ot-btn ot-btn--ghost" type="button" id="replay">Ver la entrada de una oferta nueva</button></div>
</div>
<script>
(function () {
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.getElementById('replay').addEventListener('click', function () {
    var el = document.getElementById('big');
    if (!window.Motion || reduce) { el.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 150 }); return; }
    Motion.animate(el, { scale: [0.85, 1], rotate: [-3, -3] }, { type: 'spring', stiffness: 420, damping: 32 });
  });
})();
</script>
</body>
</html>
