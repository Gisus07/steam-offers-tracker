<!-- @dsCard group="Estados" height=250 subtitle="Sale de la barra: la cápsula crece con el mensaje y la acción, y vuelve a los 5 s" -->
<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>Toast</title>
<script src="https://cdn.jsdelivr.net/npm/lucide@1.57.0/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/motion@14.3.0/dist/motion.js"></script></head>
<body class="ot-root">
<div class="ot-pad ot-col" id="root" style="gap:16px">
  <div class="ot-row">
    <button class="ot-btn ot-btn--secondary" type="button" id="undoDemo">Descartar un juego</button>
    <button class="ot-btn ot-btn--secondary" type="button" id="errDemo">Fallar la carga</button>
  </div>
  <div style="height:128px;display:flex;align-items:flex-end">
    <div class="ot-dock" id="dock">
      <div class="ot-dock__panel" id="panel">
        <div class="ot-dock__msg" id="msg" role="status">
          <span class="ot-dock__icon" id="icUndo"><i data-lucide="eye-off"></i></span>
          <span class="ot-dock__icon" id="icBad" hidden><i data-lucide="circle-alert"></i></span>
          <span class="ot-dock__text" id="msgText">No te mostraremos más este juego</span>
          <button class="ot-btn ot-btn--primary" type="button" id="msgAction">Deshacer</button>
        </div>
        <nav class="ot-nav" aria-label="Principal">
          <span class="ot-nav__pill" aria-hidden="true"></span>
          <button type="button" aria-label="Para ti" aria-current="page"><i data-lucide="sparkles"></i></button>
          <button type="button" aria-label="Explorar"><i data-lucide="search"></i></button>
          <button type="button" aria-label="Guardados"><i data-lucide="bookmark"></i></button>
          <button type="button" aria-label="Ajustes"><i data-lucide="settings"></i></button>
        </nav>
      </div>
    </div>
  </div>
</div>
<script>
(function () {
  if (window.lucide) lucide.createIcons({ attrs: { 'stroke-width': 2 } });
  var M = window.Motion, reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var anim = !!M && !reduce;
  var dock = document.getElementById('dock'), panel = document.getElementById('panel'), msg = document.getElementById('msg');
  var text = document.getElementById('msgText'), action = document.getElementById('msgAction');
  var icUndo = document.getElementById('icUndo'), icBad = document.getElementById('icBad');
  var timer = null, open = false;
  var SPRING = { type: 'spring', stiffness: 340, damping: 28, velocity: 0 };
  // Abre: cápsula con muelle 340/28 y mensaje a los 200 ms (260 ms). Cierra: mensaje en 180 ms y la cápsula 100 ms después
  function setOpen(next) {
    if (next === open) return;
    open = next;
    dock.classList.toggle('ot-dock--open', next);
    var w = next ? Math.min(dock.clientWidth, 358) : 232;
    if (anim) {
      if (next) {
        M.animate(panel, { width: w + 'px', height: '124px', borderRadius: '28px' }, SPRING);
        M.animate(msg, { opacity: [0, 1] }, { duration: 0.26, delay: 0.2 });
      } else {
        M.animate(msg, { opacity: 0 }, { duration: 0.18 });
        M.animate(panel, { width: '232px', height: '64px', borderRadius: '32px' }, Object.assign({}, SPRING, { delay: 0.1 }));
      }
    } else {
      panel.style.width = w + 'px';
      panel.style.height = next ? '124px' : '64px';
      panel.style.borderRadius = next ? '28px' : '32px';
      msg.style.opacity = next ? '1' : '0';
    }
  }
  function show(kind) {
    var bad = kind === 'error';
    msg.classList.toggle('ot-dock__msg--bad', bad);
    icUndo.hidden = bad;
    icBad.hidden = !bad;
    text.textContent = bad ? 'No pudimos actualizar las ofertas' : 'No te mostraremos más este juego';
    action.textContent = bad ? 'Reintentar' : 'Deshacer';
    clearTimeout(timer);
    setOpen(true);
    timer = setTimeout(function () { setOpen(false); }, 5000);
  }
  document.getElementById('undoDemo').addEventListener('click', function () { show('undo'); });
  document.getElementById('errDemo').addEventListener('click', function () { show('error'); });
  action.addEventListener('click', function () { clearTimeout(timer); setOpen(false); });
})();
</script>
</body>
</html>
