<!-- @dsCard group="Oferta" height=250 subtitle="90 días, con el mínimo registrado" -->
<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>PriceHistory</title>
<script src="https://cdn.jsdelivr.net/npm/lucide@1.57.0/dist/umd/lucide.min.js"></script></head>
<body class="ot-root">
<div class="ot-pad" id="root">
  <div class="ot-hist">
    <div class="ot-row" style="justify-content:space-between">
      <span class="ot-label">Precio en 90 días</span>
      <span class="ot-chip ot-chip--good"><i data-lucide="trending-down"></i>Mínimo registrado</span>
    </div>
    <svg viewBox="0 0 320 120" role="img" aria-label="El precio bajó de USD 5,99 a USD 0,52, el mínimo registrado">
      <line class="ot-hist__grid" x1="28" y1="14" x2="316" y2="14"></line>
      <line class="ot-hist__grid" x1="28" y1="57" x2="316" y2="57"></line>
      <line class="ot-hist__grid" x1="28" y1="100" x2="316" y2="100"></line>
      <text class="ot-hist__axis" x="0" y="18">6</text>
      <text class="ot-hist__axis" x="0" y="61">3</text>
      <text class="ot-hist__axis" x="0" y="104">0</text>
      <path class="ot-hist__area" d="M28 14 H120 V67 H170 V14 H260 V92.5 H316 V100 H28 Z"></path>
      <path class="ot-hist__line" d="M28 14 H120 V67 H170 V14 H260 V92.5 H316"></path>
      <circle class="ot-hist__min" cx="288" cy="92.5" r="5"></circle>
      <circle class="ot-hist__now" cx="316" cy="92.5" r="4"></circle>
      <text class="ot-hist__axis" x="28" y="118">ago</text>
      <text class="ot-hist__axis" x="160" y="118">sep</text>
      <text class="ot-hist__axis" x="286" y="118">oct</text>
    </svg>
    <span class="ot-muted">Mínimo registrado: USD 0,52, desde que seguimos este juego.</span>
  </div>
</div>
<script>
(function () { if (window.lucide) lucide.createIcons({ attrs: { 'stroke-width': 2 } }); })();
</script>
</body>
</html>
