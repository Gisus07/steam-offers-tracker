<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>CountdownChip</title>
<script src="https://cdn.jsdelivr.net/npm/lucide@1.57.0/dist/umd/lucide.min.js"></script></head>
<body class="ot-root">
<div class="ot-pad ot-row" id="root">
  <span class="ot-chip"><i data-lucide="clock"></i>Termina en 2 d 4 h</span>
  <span class="ot-chip ot-chip--hot"><i data-lucide="clock"></i>Termina hoy, 18:00</span>
  <span class="ot-chip ot-chip--hot"><i data-lucide="clock"></i>Termina mañana, 9:00</span>
</div>
<script>
(function () { if (window.lucide) lucide.createIcons({ attrs: { 'stroke-width': 2 } }); })();
</script>
</body>
</html>
