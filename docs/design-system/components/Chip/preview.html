<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>Chip</title>
<script src="https://cdn.jsdelivr.net/npm/lucide@1.57.0/dist/umd/lucide.min.js"></script></head>
<body class="ot-root">
<div class="ot-pad ot-row" id="root" style="gap:8px">
  <span class="ot-chip ot-chip--tag">ROGUELIKE</span>
  <span class="ot-chip ot-chip--tag">PIXEL ART</span>
  <span class="ot-chip ot-chip--good"><i data-lucide="trending-down"></i>Mínimo registrado</span>
  <span class="ot-chip ot-chip--info"><i data-lucide="compass"></i>Algo distinto</span>
  <span class="ot-chip ot-chip--info"><i data-lucide="wifi-off"></i>Sin conexión · 14:20</span>
</div>
<script>
(function () { if (window.lucide) lucide.createIcons({ attrs: { 'stroke-width': 2 } }); })();
</script>
</body>
</html>
