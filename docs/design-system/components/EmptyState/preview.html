<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>EmptyState</title>
<script src="https://cdn.jsdelivr.net/npm/lucide@1.57.0/dist/umd/lucide.min.js"></script></head>
<body class="ot-root">
<div id="root">
  <div class="ot-empty">
    <span class="ot-empty__icon"><i data-lucide="sparkles"></i></span>
    <p class="ot-empty__title">Todavía no hay ofertas para ti</p>
    <p class="ot-empty__text">Aparecen cuando Steam publica rebajas; te avisamos cuando llegue una que te guste.</p>
    <button class="ot-btn ot-btn--secondary" type="button" style="margin-top:8px">Ajustar mis gustos</button>
  </div>
</div>
<script>
(function () { if (window.lucide) lucide.createIcons({ attrs: { 'stroke-width': 2 } }); })();
</script>
</body>
</html>
