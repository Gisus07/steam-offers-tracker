<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Botón</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/offers-tracker/tokens.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<span style="{{wrapStyle}}">
  <sc-if value="{{isLink}}" hint-placeholder-val="{{false}}">
    <a href="{{href}}" aria-label="{{aria}}" onPointerDown="{{down}}" onPointerUp="{{up}}" onPointerLeave="{{up}}" onPointerCancel="{{up}}" style="{{style}}"><sc-if value="{{hasIcon}}" hint-placeholder-val="{{false}}"><svg viewBox="0 0 24 24" aria-hidden="true" style="{{iconStyle}}"><path d="{{p0}}"></path><path d="{{p1}}"></path><path d="{{p2}}"></path></svg></sc-if><sc-if value="{{hasText}}" hint-placeholder-val="{{true}}"><span>{{label}}</span></sc-if></a>
  </sc-if>
  <sc-if value="{{isButton}}" hint-placeholder-val="{{true}}">
    <button type="button" aria-label="{{aria}}" aria-pressed="{{toggled}}" disabled="{{disabled}}" onClick="{{press}}" onPointerDown="{{down}}" onPointerUp="{{up}}" onPointerLeave="{{up}}" onPointerCancel="{{up}}" style="{{style}}"><sc-if value="{{hasIcon}}" hint-placeholder-val="{{false}}"><svg viewBox="0 0 24 24" aria-hidden="true" style="{{iconStyle}}"><path d="{{p0}}"></path><path d="{{p1}}"></path><path d="{{p2}}"></path></svg></sc-if><sc-if value="{{hasText}}" hint-placeholder-val="{{true}}"><span>{{label}}</span></sc-if></button>
  </sc-if>
</span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"variant":{"editor":"enum","options":["primary","secondary","text","steam","icon"],"default":"primary"},"label":{"editor":null},"size":{"editor":null},"block":{"editor":null},"href":{"editor":null},"icon":{"editor":null},"toggled":{"editor":null},"disabled":{"editor":null},"onPress":{"editor":null},"$preview":{"width":358,"height":56}}'>
class Component extends DCLogic {
  renderVals() {
    var s = this.state || {};
    var self = this;
    var p = this.props;
    var standalone = p.label == null;
    var variant = p.variant ?? 'primary';
    var size = p.size ?? 'lg';
    var block = p.block ?? standalone;
    var label = p.label ?? 'Continuar';
    var isIcon = variant === 'icon';
    var disabled = !!p.disabled;
    var pressed = !!s.pressed && !disabled;
    var ICONS = {
      x: ['M18 6 6 18', 'm6 6 12 12', 'M0 0'],
      external: ['M15 3h6v6', 'M10 14 21 3', 'M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6'],
      bookmark: ['M17 3a2 2 0 0 1 2 2v15a1 1 0 0 1-1.496.868l-4.512-2.578a2 2 0 0 0-1.984 0l-4.512 2.578A1 1 0 0 1 5 20V5a2 2 0 0 1 2-2z', 'M0 0', 'M0 0'],
      back: ['m15 18-6-6 6-6', 'M0 0', 'M0 0']
    };
    var paths = ICONS[p.icon] || null;
    // Estilo control: cápsula (círculo en los de ícono) con un canto de 4px que desaparece al presionar.
    // Los cantos salen de los tokens accent-lip, raised-lip e ink-lip; la mezcla es el respaldo.
    var RAISED = 'var(--raised-lip, color-mix(in srgb, var(--line) 85%, var(--line-strong)))';
    var C = {
      primary: { bg: 'var(--accent)', fg: 'var(--on-accent)', border: '1px solid transparent', lip: 'var(--accent-lip, color-mix(in srgb, var(--accent) 55%, #000))' },
      secondary: { bg: 'var(--surface-raised)', fg: 'var(--ink)', border: '1px solid var(--line)', lip: RAISED },
      text: { bg: 'transparent', fg: 'var(--accent)', border: '1px solid transparent', lip: '' },
      steam: { bg: 'var(--ink)', fg: 'var(--bg)', border: '1px solid transparent', lip: 'var(--ink-lip, color-mix(in srgb, var(--ink) 58%, #000))' },
      icon: { bg: 'var(--surface-raised)', fg: 'var(--ink-2)', border: '1px solid var(--line)', lip: RAISED }
    };
    var c = C[variant] || C.primary;
    var on = isIcon && !!p.toggled;
    var h = (isIcon || size === 'md') ? 44 : 52;
    var fg = on ? 'var(--good)' : c.fg;
    var bg = on ? 'var(--good-soft)' : c.bg;
    if (variant === 'text' && pressed) bg = 'var(--accent-soft)';
    var lip = c.lip ? 4 : 0;
    var sunk = pressed ? lip : 0;
    var shadow = lip ? '0 ' + (lip - sunk) + 'px 0 ' + c.lip : 'none';
    // Baja en 120 ms; al soltar vuelve con una curva que imita el muelle 500/26
    var transition = pressed
      ? 'transform 120ms ease-out, box-shadow 120ms ease-out, background-color 200ms ease, color 200ms ease'
      : 'transform 300ms cubic-bezier(.3, 1.4, .5, 1), box-shadow 160ms ease-out, background-color 200ms ease, color 200ms ease';
    var style = 'box-sizing: border-box; display: ' + (block ? 'flex' : 'inline-flex') + '; align-items: center; justify-content: center; gap: 8px; width: ' + (block ? '100%' : (isIcon ? '44px' : 'auto')) + '; height: ' + h + 'px; margin: 0; padding: 0 ' + (isIcon ? 0 : (size === 'md' ? 18 : 24)) + 'px; border: ' + c.border + '; border-radius: ' + (h / 2) + 'px; background: ' + bg + '; color: ' + fg + '; font-family: var(--font-sans); font-weight: ' + (variant === 'text' ? 600 : 700) + '; font-size: ' + (size === 'md' ? 15 : 16) + 'px; line-height: 20px; text-decoration: none; white-space: nowrap; vertical-align: top; cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; transform: translateY(' + sunk + 'px); box-shadow: ' + shadow + '; transition: ' + transition + ';' + (disabled ? ' opacity: .45; pointer-events: none;' : '');
    var icon = isIcon ? 22 : 20;
    return {
      wrapStyle: 'display: ' + (block ? 'block' : 'inline-block') + '; width: ' + (block ? '100%' : 'auto') + '; vertical-align: top; font-family: var(--font-sans); color: var(--ink);',
      isLink: !!p.href,
      isButton: !p.href,
      href: p.href,
      aria: isIcon ? label : undefined,
      toggled: p.toggled == null ? undefined : !!p.toggled,
      disabled: disabled,
      label: label,
      hasIcon: !!paths,
      hasText: !isIcon,
      p0: paths ? paths[0] : 'M0 0',
      p1: paths ? paths[1] : 'M0 0',
      p2: paths ? paths[2] : 'M0 0',
      iconStyle: 'width: ' + icon + 'px; height: ' + icon + 'px; flex: none; fill: ' + (on ? 'currentColor' : 'none') + '; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;',
      style: style,
      down: function () { if (!disabled) self.setState({ pressed: true }); },
      up: function () { if (self.state && self.state.pressed) self.setState({ pressed: false }); },
      press: function (e) { if (typeof p.onPress === 'function') p.onPress(e); }
    };
  }
}
</script>
</body>
</html>
