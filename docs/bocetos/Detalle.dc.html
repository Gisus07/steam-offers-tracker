<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Detalle de la oferta</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/offers-tracker/tokens.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div data-theme="{{theme}}" style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--font-sans);">
  <div style="height: 844px; overflow-y: auto; box-sizing: border-box; padding-bottom: 104px;">
    <div style="position: relative; height: 224px; background: var(--surface-raised);">
      <div aria-hidden="true" style="position: absolute; inset: 0; display: flex; align-items: flex-end; box-sizing: border-box; padding: 0 20px 34px 132px; font-family: var(--font-display); font-weight: 800; font-size: 40px; line-height: 40px; color: var(--ink-3);">{{d.name}}</div>
      <sc-if value="{{hasClose}}" hint-placeholder-val="{{false}}">
        <button type="button" aria-label="Volver" onClick="{{close}}" style="position: absolute; top: 16px; left: 16px; width: 44px; height: 44px; display: grid; place-items: center; margin: 0; padding: 0; border: 0; border-radius: 999px; background: var(--surface); color: var(--ink); box-shadow: var(--shadow-float); cursor: pointer;"><svg viewBox="0 0 24 24" aria-hidden="true" style="width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;"><path d="m15 18-6-6 6-6"></path></svg></button>
      </sc-if>
      <sc-if value="{{noClose}}" hint-placeholder-val="{{true}}">
        <a href="Main.dc.html" aria-label="Volver" style="position: absolute; top: 16px; left: 16px; width: 44px; height: 44px; display: grid; place-items: center; border-radius: 999px; background: var(--surface); color: var(--ink); box-shadow: var(--shadow-float);"><svg viewBox="0 0 24 24" aria-hidden="true" style="width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;"><path d="m15 18-6-6 6-6"></path></svg></a>
      </sc-if>
      <button type="button" aria-label="{{saveLabel}}" aria-pressed="{{saved}}" onClick="{{toggleSave}}" style="{{saveStyle}}"><svg viewBox="0 0 24 24" aria-hidden="true" style="{{saveIcon}}"><path d="M17 3a2 2 0 0 1 2 2v15a1 1 0 0 1-1.496.868l-4.512-2.578a2 2 0 0 0-1.984 0l-4.512 2.578A1 1 0 0 1 5 20V5a2 2 0 0 1 2-2z"></path></svg></button>
      <span aria-label="{{stickerLabel}}" style="position: absolute; left: 16px; bottom: -20px; display: inline-flex; padding: 8px 11px 7px; background: var(--deal); color: var(--on-deal); font-family: var(--font-display); font-weight: 800; font-size: 32px; line-height: 32px; letter-spacing: 0.01em; border-radius: 6px; transform: rotate(-3deg); box-shadow: var(--shadow-sticker);">−{{d.pct}}%</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 20px; padding: 36px 16px 0;">
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <h1 style="margin: 0; font-weight: 700; font-size: 22px; line-height: 28px;">{{d.name}}</h1>
        <p style="margin: 0; font-size: 13px; line-height: 18px; color: var(--ink-2);">{{reviewsLine}}</p>
        <div style="display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px;">
          <sc-for list="{{d.tags}}" as="tag" hint-placeholder-count="3">
            <span style="display: inline-flex; align-items: center; height: 26px; padding: 0 10px; border-radius: 999px; background: var(--surface-raised); color: var(--ink-2); font-weight: 600; font-size: 11px; line-height: 16px; letter-spacing: 0.04em; text-transform: uppercase;">{{tag}}</span>
          </sc-for>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 15px; line-height: 22px; color: var(--ink-3); text-decoration: line-through; font-variant-numeric: tabular-nums;">{{d.was}}</span>
        <span style="font-family: var(--font-display); font-weight: 800; font-size: 44px; line-height: 44px; font-variant-numeric: tabular-nums;">{{d.now}}</span>
        <span style="font-weight: 600; font-size: 12px; line-height: 16px; color: var(--good);">Ahorras {{d.save}}</span>
      </div>
      <span style="display: inline-flex; align-self: flex-start; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 999px; background: var(--surface-raised); color: var(--ink-2); font-weight: 500; font-size: 13px; line-height: 16px; font-variant-numeric: tabular-nums;"><svg viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;"><circle cx="12" cy="12" r="10"></circle><path d="M12 6v6l4 2"></path></svg>Termina el {{d.endAbs}}</span>
      <section style="display: flex; flex-direction: column; gap: 8px; padding: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px;">
        <span style="font-weight: 600; font-size: 12px; line-height: 16px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3);">Precio en Venezuela</span>
        <p style="margin: 0; font-size: 15px; line-height: 22px; color: var(--ink-2);">Lo seguimos desde el 1 de noviembre. Todavía no hay historial para comparar: el gráfico aparece con el segundo cambio de precio.</p>
      </section>
    </div>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; gap: 8px; box-sizing: border-box; padding: 12px 16px 20px; background: var(--bg); border-top: 1px solid var(--line);">
    <div style="flex: none;">
      <dc-import name="Button" label="No me interesa" variant="secondary" icon="x" onPress="{{dismiss}}" hint-size="178px,52px"></dc-import>
    </div>
    <div style="flex: 1; min-width: 0;">
      <dc-import name="Button" label="Ir a Steam" variant="primary" icon="external" href="{{storeUrl}}" block="{{true}}" hint-size="172px,52px"></dc-import>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark","section":"Tema"},"item":{"editor":null},"saved":{"editor":null},"onSave":{"editor":null},"onClose":{"editor":null},"onDismiss":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var s = this.state || {};
    var self = this;
    var p = this.props;
    var DEF = { id: 588650, name: 'Dead Cells', pct: 50, was: 'USD 12,49', now: 'USD 6,24', save: 'USD 6,25', endAbs: '4 de noviembre, 14:00', reviewPct: 97, reviews: '157.300', dev: 'Motion Twin', tags: ['Aventura', 'Roguelike', 'Metroidvania', 'Pixelados'] };
    var d = p.item ?? DEF;
    var external = typeof p.onSave === 'function';
    var saved = external ? !!p.saved : (s.saved ?? true);
    return {
      theme: p.theme ?? 'dark',
      d: d,
      reviewsLine: d.dev + ' · ' + d.reviewPct + '% positivas de ' + d.reviews + ' reseñas',
      stickerLabel: d.pct + ' por ciento de descuento',
      storeUrl: 'https://store.steampowered.com/app/' + d.id + '/',
      hasClose: typeof p.onClose === 'function',
      noClose: typeof p.onClose !== 'function',
      close: p.onClose,
      saved: saved,
      saveLabel: saved ? 'Guardado' : 'Guardar',
      saveStyle: 'position: absolute; top: 16px; right: 16px; width: 44px; height: 44px; display: grid; place-items: center; margin: 0; padding: 0; border: 0; border-radius: 999px; background: var(--surface); color: ' + (saved ? 'var(--good)' : 'var(--ink)') + '; box-shadow: var(--shadow-float); cursor: pointer; transition: color 200ms ease;',
      saveIcon: 'width: 22px; height: 22px; fill: ' + (saved ? 'currentColor' : 'none') + '; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: fill 200ms ease;',
      toggleSave: function () { if (external) p.onSave(); else self.setState({ saved: !saved }); },
      dismiss: function () { if (typeof p.onDismiss === 'function') p.onDismiss(); }
    };
  }
}
</script>
</body>
</html>
