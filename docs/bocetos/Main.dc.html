<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Para ti</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/offers-tracker/tokens.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div data-theme="{{theme}}" data-proto-root="{{uid}}" style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--font-sans);">
  <div style="{{scrollStyle}}">
    <header style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;">
      <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0;">
        <h1 style="margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 34px; line-height: 36px; letter-spacing: 0.005em;">Para ti</h1>
        <p style="margin: 0; font-size: 13px; line-height: 18px; color: var(--ink-2);">{{updated}}</p>
      </div>
      <button type="button" aria-label="Actualizar" onClick="{{refresh}}" style="width: 44px; height: 44px; flex: none; display: grid; place-items: center; margin: 0; padding: 0; border: 0; border-radius: 22px; background: var(--surface-raised); color: var(--ink-2); cursor: pointer;"><svg viewBox="0 0 24 24" aria-hidden="true" style="{{spinStyle}}"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path><path d="M8 16H3v5"></path></svg></button>
    </header>
    <div role="tablist" aria-label="Vista" style="position: relative; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 4px; border-radius: 22px; background: var(--surface-raised);">
      <span aria-hidden="true" style="{{pillStyle}}"></span>
      <button type="button" role="tab" aria-selected="{{forYouSelected}}" onClick="{{showForYou}}" style="{{forYouTabStyle}}">Para ti</button>
      <button type="button" role="tab" aria-selected="{{soonSelected}}" onClick="{{showSoon}}" style="{{soonTabStyle}}">Terminan pronto</button>
    </div>
    <sc-if value="{{isSoon}}" hint-placeholder-val="{{false}}">
      <p style="margin: 0; font-weight: 600; font-size: 12px; line-height: 16px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--hot);">Terminan en menos de 24 horas</p>
    </sc-if>
    <div data-list="1" style="position: relative; display: flex; flex-direction: column; gap: 16px;">
      <sc-for list="{{cards}}" as="item" hint-placeholder-count="3">
        <div data-card-wrap="1" data-id="{{item.id}}" style="{{item.wrapStyle}}">
          <dc-import name="Card" item="{{item}}" hint-size="358px,400px"></dc-import>
        </div>
      </sc-for>
      <sc-if value="{{showSkel}}" hint-placeholder-val="{{false}}">
        <div aria-hidden="true" style="position: absolute; left: 0; top: 0; right: 0; z-index: 2; pointer-events: none;">
          <sc-for list="{{skel}}" as="sk" hint-placeholder-count="2">
            <div style="{{sk.box}}">
              <sc-for list="{{sk.blocks}}" as="b" hint-placeholder-count="8">
                <span style="{{b.style}}"></span>
              </sc-for>
              <span style="{{sk.band}}"></span>
            </div>
          </sc-for>
        </div>
      </sc-if>
    </div>
  </div>
  <div style="position: absolute; left: 16px; right: 16px; bottom: 16px; z-index: 10;">
    <dc-import name="Nav" active="parati" bump="{{bump}}" toast="{{toast}}" hint-size="358px,64px"></dc-import>
  </div>
  <sc-if value="{{hasFly}}" hint-placeholder-val="{{false}}">
    <svg viewBox="0 0 24 24" aria-hidden="true" style="{{flyStyle}}"><path d="M17 3a2 2 0 0 1 2 2v15a1 1 0 0 1-1.496.868l-4.512-2.578a2 2 0 0 0-1.984 0l-4.512 2.578A1 1 0 0 1 5 20V5a2 2 0 0 1 2-2z"></path></svg>
  </sc-if>
  <sc-if value="{{hasDetail}}" hint-placeholder-val="{{false}}">
    <div aria-hidden="true" style="{{scrimStyle}}"></div>
    <div style="{{boxStyle}}">
      <div aria-hidden="true" style="{{faceStyle}}">
        <dc-import name="Card" item="{{detailCard}}" hint-size="358px,400px"></dc-import>
      </div>
      <div style="{{detStyle}}">
        <dc-import name="Detalle" theme="{{theme}}" item="{{detailItem}}" saved="{{detailSaved}}" onSave="{{detailSave}}" onClose="{{closeDetail}}" onDismiss="{{detailDismiss}}" hint-size="390px,844px"></dc-import>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>

      var op = 1, tf = 'none', tr = 'none', mh = '440px', mt = '0px', ov = 'visible', pe = '';
      if (phase === 'loading' || phase === 'form0') { op = i < 3 ? 1 : 0; }
      else if (phase === 'form') { op = 1; tr = i < 3 ? 'none' : 'opacity 300ms ease ' + (600 + (i - 3) * 80) + 'ms'; }
      else if (phase === 'swap0') { op = 0; tf = 'translateY(12px)'; }
      else if (phase === 'swap') { op = 1; tf = 'translateY(0px)'; tr = 'opacity 380ms ease ' + (i * 90) + 'ms, transform 380ms cubic-bezier(.2, .8, .2, 1) ' + (i * 90) + 'ms'; }
      var FLUNG = 'translateX(-420px) rotate(-10deg) scale(0.92)';
      var COLLAPSE = 'max-height 340ms cubic-bezier(.2, 0, 0, 1), margin-top 340ms cubic-bezier(.2, 0, 0, 1)';
      if (k === 'fs') { var f = fx[g.id] || { dx: 0, rot: 0, sc: 1 }; op = 1; tf = 'translateX(' + f.dx.toFixed(1) + 'px) rotate(' + f.rot.toFixed(2) + 'deg) scale(' + f.sc + ')'; tr = 'none'; mh = H + 'px'; }
      else if (k === 'fl') { op = 0; tf = FLUNG; tr = 'transform 320ms cubic-bezier(.55, 0, 1, .45), opacity 320ms ease-in'; mh = H + 'px'; }
      else if (k === 'gone') { op = 0; tf = FLUNG; mh = '0px'; mt = '-16px'; ov = 'hidden'; tr = COLLAPSE; pe = ' pointer-events: none;'; }
      else if (k === 'bs') { op = 0; tf = FLUNG; mh = H + 'px'; ov = 'hidden'; tr = COLLAPSE; pe = ' pointer-events: none;'; }
      else if (k === 'bk') { op = 1; tf = 'none'; mh = H + 'px'; tr = 'transform 440ms cubic-bezier(.3, 1.1, .5, 1), opacity 300ms ease-out'; }
      if (det && det.id === g.id) { op = 0; tr = 'none'; }
      return 'position: relative; max-height: ' + mh + '; margin-top: ' + mt + '; overflow: ' + ov + '; opacity: ' + op + '; transform: ' + tf + '; transition: ' + tr + ';' + pe;
    }
    var cards = list.map(function (g, i) {
      var reveal = null, stamp, stampDelay;
      if (i < 3 && (phase === 'loading' || phase === 'form0')) reveal = { on: false };
      else if (i < 3 && phase === 'form') {
        reveal = { on: true, d: partD[i] || {} };
        stamp = s.stamp;
        stampDelay = (partD[i] || {}).media || 0;
      }
      return Object.assign({}, g, {
        saved: !!saved[g.id],
        wrapStyle: wrap(g, i),
        reveal: reveal,
        stamp: stamp,
        stampDelay: stampDelay,
        onSave: function (info) { self.toggleSave(g.id, info); },
        onDismiss: function (info) { self.dismiss(g.id, info); },
        onOpen: function (e) { self.openDetail(g, e); }
      });
    });

    // Pastilla del segmentado: posición con left y ancho con width, el apretón con scaleY, cada uno con su curva
    var seg = s.seg || null;
    var CW = 175, L0 = 4;
    var pl, pw, ptr = [], psy = 1;
    if (seg && seg.stage === 'stretch') {
      pl = L0; pw = CW * 2;
      ptr.push('left 320ms ' + CBM, 'width 320ms ' + CBM);
    } else {
      pl = L0 + (tab === 'soon' ? CW : 0); pw = CW;
      ptr.push('left 420ms cubic-bezier(.3, 1.12, .5, 1)', 'width 420ms cubic-bezier(.3, 1.12, .5, 1)');
      if (seg && seg.squish === 1) psy = 0.86;
      if (seg && seg.squish === 2) ptr.push('transform 420ms cubic-bezier(.3, 1.6, .5, 1)');
    }
    var tabBase = 'position: relative; z-index: 1; height: 36px; margin: 0; padding: 0; border: 0; background: transparent; font-family: var(--font-sans); font-weight: 600; font-size: 14px; line-height: 18px; border-radius: 18px; cursor: pointer; transition: color 200ms ease;';

    // Copia que vuela a Guardados: x con easeOut e y con [.55, 0, .85, .35] dibujan el arco
    var fly = s.fly || null;
    var flyStyle = '';
    if (fly) {
      var go = fly.stage === 'go';
      var p = go ? fly.to : fly.from;
      flyStyle = 'position: absolute; z-index: 40; left: ' + (p.x - 11).toFixed(1) + 'px; top: ' + (p.y - 11).toFixed(1) + 'px; width: 22px; height: 22px; color: var(--good); fill: currentColor; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; transform: scale(' + (go ? 0.55 : 1) + '); transition: ' + (go ? 'left 700ms cubic-bezier(0, 0, .58, 1), top 700ms cubic-bezier(.55, 0, .85, .35), transform 700ms ease-in' : 'none') + ';';
    }

    // Detalle
    var all = FEED.concat(SOON);
    var dItem = null;
    if (det) { for (var j = 0; j < all.length; j++) { if (all[j].id === det.id) { dItem = all[j]; break; } } }
    var stage = det ? det.stage : null;
    var openS = stage === 'open';
    var R = det ? det.rect : null;
    var CBD = 'cubic-bezier(.25, 1, .4, 1)';
    var boxTr = stage === 'start' ? 'none' : ['left', 'top', 'width', 'height', 'border-radius'].map(function (q) { return q + ' 460ms ' + CBD; }).join(', ');
    var recede = !!det && openS;

    return {
      theme: this.props.theme ?? 'dark',
      uid: this.uid,
      scrollStyle: 'height: 844px; overflow-y: auto; box-sizing: border-box; padding: 28px 16px 120px; display: flex; flex-direction: column; gap: 16px; transform: scale(' + (recede ? 0.94 : 1) + '); transition: transform 460ms ' + CBD + ';',
      updated: phase === 'loading' ? 'Buscando ofertas en Venezuela…' : ((s.fresh ? 'Actualizado ahora' : 'Actualizado hace 2 h') + ' · Venezuela · precios en USD'),
      spinStyle: 'width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transform: rotate(' + ((s.spin || 0) * 360) + 'deg); transition: transform 700ms cubic-bezier(.3, 1.2, .45, 1);',
      refresh: function () { self.refresh(); },
      cards: cards,
      isSoon: tab === 'soon',
      forYouSelected: tab === 'foryou',
      soonSelected: tab === 'soon',
      pillStyle: 'position: absolute; top: 4px; bottom: 4px; left: ' + pl + 'px; width: ' + pw + 'px; border-radius: 18px; background: var(--surface); box-shadow: var(--shadow-card); transform: scaleY(' + psy + '); transition: ' + ptr.join(', ') + ';',
      forYouTabStyle: tabBase + ' color: ' + (tab === 'foryou' ? 'var(--ink)' : 'var(--ink-2)') + ';',
      soonTabStyle: tabBase + ' color: ' + (tab === 'soon' ? 'var(--ink)' : 'var(--ink-2)') + ';',
      showForYou: function () { self.showTab('foryou'); },
      showSoon: function () { self.showTab('soon'); },
      showSkel: skelOn,
      skel: skel,
      bump: s.bump || 0,
      toast: s.toast || null,
      hasFly: !!fly,
      flyStyle: flyStyle,
      hasDetail: !!(det && dItem),
      scrimStyle: 'position: absolute; inset: 0; z-index: 25; background: var(--scrim); opacity: ' + (openS ? 1 : 0) + '; transition: ' + (stage === 'start' ? 'none' : 'opacity 300ms ease') + '; pointer-events: none;',
      boxStyle: R ? 'position: absolute; z-index: 30; overflow: hidden; background: var(--bg); left: ' + (openS ? 0 : R.x).toFixed(1) + 'px; top: ' + (openS ? 0 : R.y).toFixed(1) + 'px; width: ' + (openS ? 390 : R.w).toFixed(1) + 'px; height: ' + (openS ? 844 : R.h).toFixed(1) + 'px; border-radius: ' + (openS ? 0 : 16) + 'px; transition: ' + boxTr + ';' + (stage === 'closing' ? ' pointer-events: none;' : '') : '',
      faceStyle: 'position: absolute; left: 0; top: 0; width: 358px; pointer-events: none; opacity: ' + (openS ? 0 : 1) + '; transition: ' + (stage === 'start' ? 'none' : (openS ? 'opacity 140ms ease' : 'opacity 240ms ease 120ms')) + ';',
      detStyle: 'position: absolute; left: 0; top: 0; width: 390px; height: 844px; opacity: ' + (openS ? 1 : 0) + '; transition: ' + (stage === 'start' ? 'none' : (openS ? 'opacity 260ms ease 160ms' : 'opacity 140ms ease')) + ';',
      detailCard: dItem ? Object.assign({}, dItem, { saved: det ? !!saved[det.id] : false }) : null,
      detailItem: dItem,
      detailSaved: det ? !!saved[det.id] : false,
      detailSave: function () { if (det) self.toggleSave(det.id, null); },
      closeDetail: function () { self.closeDetail(); },
      detailDismiss: function () {
        if (!det) return;
        var id = det.id;
        self.closeDetail(function () { self.dismiss(id, { dx: 0, lifted: false }); });
      }
    };
  }
}
</script>
