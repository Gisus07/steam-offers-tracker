<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Aviso en la barra</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/offers-tracker/tokens.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1266px; height: 568px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px; padding: 28px; background: var(--surface-raised); color: var(--ink); font-family: var(--font-sans);">
  <div style="display: grid; grid-template-columns: repeat(3, 390px); gap: 20px;">
    <span style="font-weight: 700; font-size: 15px; line-height: 20px;">En reposo</span>
    <span style="font-weight: 700; font-size: 15px; line-height: 20px;">Deshacer</span>
    <span style="font-weight: 700; font-size: 15px; line-height: 20px;">Error</span>
  </div>
  <sc-for list="{{themes}}" as="t" hint-placeholder-count="2">
    <div data-theme="{{t.id}}" style="display: grid; grid-template-columns: repeat(3, 390px); gap: 20px;">
      <sc-for list="{{t.cells}}" as="c" hint-placeholder-count="3">
        <div style="position: relative; height: 230px; box-sizing: border-box; border-radius: 18px; background: var(--bg); border: 1px solid var(--line); overflow: hidden;">
          <div style="display: flex; flex-direction: column; gap: 10px; padding: 16px;">
            <span style="font-weight: 600; font-size: 12px; line-height: 16px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3);">{{t.label}}</span>
            <span style="display: block; height: 72px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line);"></span>
          </div>
          <div style="position: absolute; left: 16px; right: 16px; bottom: 16px;">
            <dc-import name="Nav" active="parati" toast="{{c.toast}}" hint-size="358px,64px"></dc-import>
          </div>
        </div>
      </sc-for>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1266,"height":568}}'>
class Component extends DCLogic {
  renderVals() {
    var undo = { kind: 'undo', text: 'No te mostraremos más este juego', action: 'Deshacer' };
    var err = { kind: 'error', text: 'No pudimos actualizar las ofertas', action: 'Reintentar' };
    var cells = [{ toast: null }, { toast: undo }, { toast: err }];
    return { themes: [{ id: 'dark', label: 'Oscuro', cells: cells }, { id: 'light', label: 'Claro', cells: cells }] };
  }
}
</script>
</body>
</html>
