<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Toast: tres variantes</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/offers-tracker/tokens.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 860px; height: 620px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px; padding: 28px; background: var(--surface-raised); color: var(--ink); font-family: var(--font-sans);">
  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px;">
    <span style="font-weight: 700; font-size: 15px; line-height: 20px;">A · Cápsula invertida</span>
    <span style="font-weight: 700; font-size: 15px; line-height: 20px;">B · Isla superior</span>
    <span style="font-weight: 700; font-size: 15px; line-height: 20px;">C · Barra con tiempo</span>
  </div>
  <sc-for list="{{themes}}" as="t" hint-placeholder-count="2">
    <div data-theme="{{t.id}}" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px;">
      <div style="position: relative; height: 240px; border-radius: 18px; background: var(--bg); border: 1px solid var(--line); overflow: hidden;">
        <div style="display: flex; flex-direction: column; gap: 10px; padding: 18px;"><span style="height: 14px; width: 60%; border-radius: 6px; background: var(--surface-raised);"></span><span style="height: 70px; border-radius: 12px; background: var(--surface);"></span></div>
        <div role="status" style="position: absolute; left: 12px; right: 12px; bottom: 16px; display: flex; justify-content: center;">
          <div style="display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 4px 4px 4px 12px; border-radius: 999px; background: var(--ink); color: var(--bg); box-shadow: var(--shadow-float); font-size: 13px; line-height: 18px; font-weight: 500;">
            <svg viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"></path><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"></path><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"></path><path d="m2 2 20 20"></path></svg>
            <span>Juego oculto</span>
            <button type="button" style="height: 32px; padding: 0 12px; border: 0; border-radius: 999px; background: transparent; color: var(--accent-on-inverse); font-family: var(--font-sans); font-weight: 700; font-size: 13px;">Deshacer</button>
          </div>
        </div>
      </div>
      <div style="position: relative; height: 240px; border-radius: 18px; background: var(--bg); border: 1px solid var(--line); overflow: hidden;">
        <div role="status" style="position: absolute; left: 0; right: 0; top: 12px; display: flex; justify-content: center;">
          <div style="display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 4px 0 12px; border-radius: 999px; background: var(--surface-raised); color: var(--ink); box-shadow: var(--shadow-float); font-weight: 600; font-size: 13px; line-height: 18px;">
            <svg viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"></path><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"></path><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"></path><path d="m2 2 20 20"></path></svg>
            <span>Oculto</span>
            <button type="button" style="height: 30px; padding: 0 12px; border: 0; border-radius: 999px; background: var(--accent); color: var(--on-accent); font-family: var(--font-sans); font-weight: 700; font-size: 13px;">Deshacer</button>
          </div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 10px; padding: 66px 18px 18px;"><span style="height: 14px; width: 60%; border-radius: 6px; background: var(--surface-raised);"></span><span style="height: 70px; border-radius: 12px; background: var(--surface);"></span></div>
      </div>
      <div style="position: relative; height: 240px; border-radius: 18px; background: var(--bg); border: 1px solid var(--line); overflow: hidden;">
        <div style="display: flex; flex-direction: column; gap: 10px; padding: 18px;"><span style="height: 14px; width: 60%; border-radius: 6px; background: var(--surface-raised);"></span><span style="height: 70px; border-radius: 12px; background: var(--surface);"></span></div>
        <div role="status" style="position: absolute; left: 12px; right: 12px; bottom: 16px; display: flex; align-items: center; gap: 10px; min-height: 52px; box-sizing: border-box; padding: 8px 8px 10px 12px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-float); overflow: hidden; font-size: 13px; line-height: 18px;">
          <svg viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px; flex: none; fill: none; stroke: var(--ink-2); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"></path><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"></path><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"></path><path d="m2 2 20 20"></path></svg>
          <span style="flex: 1; min-width: 0;">Juego oculto</span>
          <button type="button" style="height: 34px; padding: 0 12px; border: 0; border-radius: 12px; background: var(--accent-soft); color: var(--accent); font-family: var(--font-sans); font-weight: 700; font-size: 13px;">Deshacer</button>
          <span aria-hidden="true" style="position: absolute; left: 0; bottom: 0; height: 3px; width: 62%; background: var(--accent);"></span>
        </div>
      </div>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":860,"height":620}}'>
class Component extends DCLogic {
  renderVals() {
    return { themes: [{ id: 'dark' }, { id: 'light' }] };
  }
}
</script>
</body>
</html>
