<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Tarjeta de oferta</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/offers-tracker/tokens.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<article aria-label="{{label}}" style="{{cardStyle}}">
  <button type="button" aria-label="{{openLabel}}" onClick="{{open}}" onPointerDown="{{downCard}}" onPointerUp="{{up}}" onPointerLeave="{{up}}" onPointerCancel="{{up}}" style="display: block; width: 100%; margin: 0; padding: 0; border: 0; background: transparent; color: inherit; font: inherit; text-align: left; cursor: pointer; -webkit-tap-highlight-color: transparent;">
    <span style="position: relative; display: block; height: 205px; background: var(--surface-raised);">
      <span aria-hidden="true" style="position: absolute; inset: 0; display: flex; align-items: flex-end; box-sizing: border-box; padding: 0 16px 26px 104px; font-family: var(--font-display); font-weight: 800; font-size: 28px; line-height: 28px; color: var(--ink-3);">{{item.name}}</span>
      <span aria-hidden="true" style="position: absolute; left: 12px; bottom: -14px; display: inline-flex; padding: 6px 8px 5px; background: var(--deal); color: var(--on-deal); font-family: var(--font-display); font-weight: 800; font-size: 20px; line-height: 20px; letter-spacing: 0.01em; border-radius: 6px; transform: rotate(-3deg); box-shadow: var(--shadow-sticker);">−{{item.pct}}%</span>
    </span>
    <span style="display: flex; flex-direction: column; gap: 8px; padding: 22px 16px 0;">
      <span style="display: block; font-weight: 700; font-size: 17px; line-height: 22px;">{{item.name}}</span>
      <span style="display: flex; flex-wrap: wrap; gap: 6px;">
        <sc-if value="{{item.explore}}" hint-placeholder-val="{{false}}">
          <span style="display: inline-flex; align-items: center; gap: 4px; height: 26px; padding: 0 10px; border-radius: 999px; background: var(--info-soft); color: var(--info); font-weight: 600; font-size: 12px; line-height: 16px;"><svg viewBox="0 0 24 24" aria-hidden="true" style="width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;"><circle cx="12" cy="12" r="10"></circle><path d="m16.24 7.76-1.804 5.411a2 2 0 0 1-1.265 1.265L7.76 16.24l1.804-5.411a2 2 0 0 1 1.265-1.265z"></path></svg>Algo distinto</span>
        </sc-if>
        <sc-for list="{{item.tags}}" as="tag" hint-placeholder-count="3">
          <span style="display: inline-flex; align-items: center; height: 26px; padding: 0 10px; border-radius: 999px; background: var(--surface-raised); color: var(--ink-2); font-weight: 600; font-size: 11px; line-height: 16px; letter-spacing: 0.04em; text-transform: uppercase;">{{tag}}</span>
        </sc-for>
      </span>
    </span>
  </button>
  <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 12px 16px 14px;">
    <div style="display: flex; flex-direction: column; gap: 6px; min-width: 0;">
      <span style="display: inline-flex; align-self: flex-start; align-items: center; gap: 4px; height: 26px; padding: 0 10px; border-radius: 999px; font-weight: 500; font-size: 12px; line-height: 16px; font-variant-numeric: tabular-nums; {{chipColors}}"><svg viewBox="0 0 24 24" aria-hidden="true" style="width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;"><circle cx="12" cy="12" r="10"></circle><path d="M12 6v6l4 2"></path></svg>{{item.ends}}</span>
      <div style="display: flex; align-items: baseline; gap: 8px;">
        <span style="font-family: var(--font-display); font-weight: 800; font-size: 26px; line-height: 26px; font-variant-numeric: tabular-nums;">{{item.now}}</span>
        <span style="font-size: 13px; line-height: 18px; color: var(--ink-3); text-decoration: line-through; font-variant-numeric: tabular-nums;">{{item.was}}</span>
      </div>
    </div>
    <div style="display: flex; gap: 8px;">
      <button type="button" aria-label="No me interesa" onClick="{{dismiss}}" onPointerDown="{{downDismiss}}" onPointerUp="{{up}}" onPointerLeave="{{up}}" onPointerCancel="{{up}}" style="{{dismissStyle}}"><svg viewBox="0 0 24 24" aria-hidden="true" style="width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button>
      <button type="button" aria-label="{{saveLabel}}" aria-pressed="{{saved}}" onClick="{{save}}" onPointerDown="{{downSave}}" onPointerUp="{{up}}" onPointerLeave="{{up}}" onPointerCancel="{{up}}" style="{{saveStyle}}"><svg viewBox="0 0 24 24" aria-hidden="true" style="{{saveIcon}}"><path d="M17 3a2 2 0 0 1 2 2v15a1 1 0 0 1-1.496.868l-4.512-2.578a2 2 0 0 0-1.984 0l-4.512 2.578A1 1 0 0 1 5 20V5a2 2 0 0 1 2-2z"></path></svg></button>
    </div>
  </div>
</article>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"item":{"editor":null},"$preview":{"width":358,"height":400}}'>
class Component extends DCLogic {
  componentDidUpdate(prev) {
    var a = prev.item, b = this.props.item;
    if (a && b && a.id === b.id && !a.saved && b.saved) this.pop();
  }
  componentWillUnmount() { clearTimeout(this.popA); clearTimeout(this.popB); }
  pop() {
    var self = this;
    clearTimeout(this.popA);
    clearTimeout(this.popB);
    this.setState({ pop: 1 });
    this.popA = setTimeout(function () { self.setState({ pop: 2 }); }, 30);
    this.popB = setTimeout(function () { self.setState({ pop: 0 }); }, 480);
  }
  renderVals() {
    var s = this.state || {};
    var self = this;
    var demo = {
      id: 588650, name: 'Dead Cells', pct: 50, was: 'USD 12,49', now: 'USD 6,24', ends: 'Termina en 2 d 18 h', hot: false, explore: false,
      tags: ['Aventura', 'Roguelike', 'Metroidvania'], saved: !!s.demoSaved
    };
    var item = this.props.item ?? demo;
    var press = s.press || null;
    var pop = s.pop || 0;
    var spring = 'cubic-bezier(.3, 1.3, .45, 1)';
    function iconBtn(kind, on) {
      var pr = press === kind;
      return 'width: 44px; height: 44px; display: grid; place-items: center; margin: 0; padding: 0; border: 0; border-radius: ' + (pr ? 14 : 22) + 'px; background: ' + (on ? 'var(--good-soft)' : 'var(--surface-raised)') + '; color: ' + (on ? 'var(--good)' : 'var(--ink-2)') + '; cursor: pointer; -webkit-tap-highlight-color: transparent; transform: scale(' + (pr ? 0.9 : 1) + '); transition: border-radius 240ms ' + spring + ', transform 240ms ' + spring + ', background-color 200ms ease, color 200ms ease;';
    }
    return {
      item: item,
      label: item.name + ', ' + item.pct + ' por ciento de descuento',
      openLabel: 'Ver el detalle de ' + item.name,
      cardStyle: 'width: 358px; box-sizing: border-box; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow-card); overflow: hidden; font-family: var(--font-sans); color: var(--ink); transform: scale(' + (press === 'card' ? 0.98 : 1) + '); transition: transform 240ms ' + spring + ';',
      chipColors: item.hot ? 'background: var(--hot-soft); color: var(--hot);' : 'background: var(--surface-raised); color: var(--ink-2);',
      saved: !!item.saved,
      saveLabel: item.saved ? 'Guardado' : 'Guardar',
      dismissStyle: iconBtn('dismiss', false),
      saveStyle: iconBtn('save', !!item.saved),
      saveIcon: 'width: 22px; height: 22px; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: ' + (item.saved ? 'currentColor' : 'none') + '; transform: scale(' + (pop === 1 ? 0.55 : 1) + '); transition: ' + (pop === 1 ? 'none' : (pop === 2 ? 'transform 420ms cubic-bezier(.34, 1.56, .64, 1)' : 'fill 200ms ease')) + ';',
      open: function (e) { if (typeof item.onOpen === 'function') item.onOpen(e); },
      save: function () {
        if (typeof item.onSave === 'function') { item.onSave(); return; }
        var now = !s.demoSaved;
        self.setState({ demoSaved: now });
        if (now) self.pop();
      },
      dismiss: function () { if (typeof item.onDismiss === 'function') item.onDismiss(); },
      downCard: function () { self.setState({ press: 'card' }); },
      downSave: function () { self.setState({ press: 'save' }); },
      downDismiss: function () { self.setState({ press: 'dismiss' }); },
      up: function () { if (self.state && self.state.press) self.setState({ press: null }); }
    };
  }
}
</script>
</body>
</html>
