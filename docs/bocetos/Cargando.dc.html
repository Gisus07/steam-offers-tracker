<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Cargando</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/offers-tracker/tokens.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
@keyframes ot-shimmer{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.skel{position:relative;overflow:hidden;background:var(--surface-raised)}
.skel::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,var(--line),transparent);animation:ot-shimmer 1.6s infinite}
@media (prefers-reduced-motion:reduce){.skel::after{animation:none}}
</style>
</helmet>
<div data-theme="{{theme}}" aria-busy="true" style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--font-sans);">
  <div style="box-sizing: border-box; padding: 28px 16px 0; display: flex; flex-direction: column; gap: 16px;">
    <header style="display: flex; flex-direction: column; gap: 4px;">
      <h1 style="margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 34px; line-height: 36px; letter-spacing: 0.005em;">Para ti</h1>
      <p style="margin: 0; font-size: 13px; line-height: 18px; color: var(--ink-2);">Buscando ofertas en Venezuela…</p>
    </header>
    <div class="skel" style="height: 44px; border-radius: 22px;"></div>
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="2">
      <div style="width: 358px; box-sizing: border-box; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden;">
        <div class="skel" style="height: 205px;"></div>
        <div style="display: flex; flex-direction: column; gap: 10px; padding: 18px 16px 16px;">
          <div class="skel" style="height: 18px; width: 72%; border-radius: 8px;"></div>
          <div style="display: flex; gap: 6px;">
            <div class="skel" style="height: 26px; width: 84px; border-radius: 999px;"></div>
            <div class="skel" style="height: 26px; width: 96px; border-radius: 999px;"></div>
            <div class="skel" style="height: 26px; width: 70px; border-radius: 999px;"></div>
          </div>
          <div class="skel" style="height: 26px; width: 120px; border-radius: 8px;"></div>
        </div>
      </div>
    </sc-for>
  </div>
  <div style="position: absolute; left: 16px; right: 16px; bottom: 16px;">
    <dc-import name="Nav" active="parati" hint-size="358px,64px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark","section":"Tema"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'dark', rows: [1, 2] };
  }
}
</script>
</body>
</html>
