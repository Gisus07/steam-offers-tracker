<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Tus gustos</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/offers-tracker/tokens.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div data-theme="{{theme}}" style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--font-sans); display: flex; flex-direction: column; padding: 32px 16px 24px; gap: 18px;">
  <div style="display: flex; flex-direction: column; gap: 10px;">
    <span style="font-weight: 600; font-size: 12px; line-height: 16px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3);">Paso 2 de 3</span>
    <div aria-hidden="true" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px;">
      <span style="height: 4px; border-radius: 999px; background: var(--accent);"></span>
      <span style="height: 4px; border-radius: 999px; background: var(--accent);"></span>
      <span style="height: 4px; border-radius: 999px; background: var(--surface-raised);"></span>
    </div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 8px;">
    <h1 style="margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 34px; line-height: 36px; letter-spacing: 0.005em;">¿Qué te gusta jugar?</h1>
    <p style="margin: 0; font-size: 15px; line-height: 22px; color: var(--ink-2);">Marcamos lo que vimos en tu biblioteca. Toca para sumar o quitar; elige al menos tres.</p>
  </div>
  <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; padding: 0 6px 0 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line);">
    <span style="display: inline-flex; align-items: center; gap: 8px; font-size: 14px; line-height: 20px;"><svg viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px; fill: none; stroke: var(--ink-2); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;"><circle cx="12" cy="12" r="10"></circle><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"></path><path d="M2 12h20"></path></svg>Venezuela · precios en USD</span>
    <button type="button" style="height: 36px; padding: 0 12px; border: 0; border-radius: 10px; background: transparent; color: var(--accent); font-family: var(--font-sans); font-weight: 600; font-size: 14px; cursor: pointer;">Cambiar</button>
  </div>
  <div style="display: flex; flex-wrap: wrap; gap: 8px;">
    <sc-for list="{{tags}}" as="t" hint-placeholder-count="12">
      <button type="button" aria-pressed="{{t.on}}" onClick="{{t.toggle}}" style="{{t.style}}">{{t.label}}</button>
    </sc-for>
  </div>
  <div style="display: flex; flex-direction: column; gap: 8px; margin-top: auto;">
    <span style="text-align: center; font-size: 13px; line-height: 18px; color: var(--ink-2); font-variant-numeric: tabular-nums;">{{countLabel}}</span>
    <a href="Avisos.dc.html" aria-disabled="{{blocked}}" style="{{cta}}">Continuar</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark","section":"Tema"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var s = this.state || {};
    var self = this;
    var all = ['Roguelike', 'Acción', '2D', 'Plataformas', 'Metroidvania', 'Pixelados', 'Implacables', 'Aventura', 'Rol', 'Roguelite', 'Terror', 'Estrategia', 'Simulación', 'Puzles', 'Mundo abierto', 'Cooperativo', 'Deportes', 'Carreras'];
    var picked = s.picked || { 'Roguelike': true, 'Acción': true, '2D': true, 'Plataformas': true, 'Metroidvania': true, 'Pixelados': true };
    var base = 'display: inline-flex; align-items: center; height: 40px; padding: 0 16px; border-radius: 999px; font-family: var(--font-sans); font-weight: 600; font-size: 14px; line-height: 18px; cursor: pointer; transition: background 200ms ease, color 200ms ease, transform 200ms ease;';
    var n = Object.keys(picked).filter(function (k) { return picked[k]; }).length;
    return {
      theme: this.props.theme ?? 'dark',
      tags: all.map(function (l) {
        var on = !!picked[l];
        return {
          label: l, on: on,
          style: base + (on ? ' background: var(--ink); color: var(--bg); border: 1px solid var(--ink);' : ' background: var(--surface); color: var(--ink); border: 1px solid var(--line-strong);'),
          toggle: function () { var p = Object.assign({}, picked); p[l] = !on; self.setState({ picked: p }); }
        };
      }),
      countLabel: n + (n === 1 ? ' elegido' : ' elegidos'),
      blocked: n < 3,
      cta: 'display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 12px; font-weight: 700; font-size: 16px; text-decoration: none; background: var(--accent); color: var(--on-accent);' + (n < 3 ? ' opacity: .45; pointer-events: none;' : '')
    };
  }
}
</script>
</body>
</html>
