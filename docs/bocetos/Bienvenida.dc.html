<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Bienvenida</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/offers-tracker/tokens.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div data-theme="{{theme}}" style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--font-sans); display: flex; flex-direction: column; padding: 40px 24px 28px; gap: 28px;">
  <button type="button" aria-label="Repetir la animación" onClick="{{replay}}" style="position: relative; display: block; width: 100%; height: 300px; flex: none; margin: 0; padding: 0; border: 0; background: transparent; cursor: pointer; -webkit-tap-highlight-color: transparent;">
    <span aria-hidden="true" style="{{c1}}"></span>
    <span aria-hidden="true" style="{{c2}}"></span>
    <span aria-hidden="true" style="{{c3}}"></span>
    <span aria-hidden="true" style="{{s1}}">−75%</span>
    <span aria-hidden="true" style="{{s2}}">−50%</span>
    <span aria-hidden="true" style="{{s3}}">−91%</span>
  </button>
  <div style="display: flex; flex-direction: column; gap: 12px;">
    <h1 style="{{h1}}">Ofertas que te van a gustar, antes de que terminen.</h1>
    <p style="{{lead}}">Miramos las rebajas de Steam en tu región y te avisamos de las que van con lo que juegas, aunque no estén en tu wishlist.</p>
  </div>
  <div style="{{cta}}">
    <dc-import name="Button" label="Iniciar sesión con Steam" variant="steam" href="Gustos.dc.html" block="{{true}}" hint-size="342px,52px"></dc-import>
    <dc-import name="Button" label="Ver ofertas sin cuenta" variant="text" size="md" href="Explorar.dc.html" block="{{true}}" hint-size="342px,44px"></dc-import>
    <p style="margin: 4px 0 0; text-align: center; font-size: 12px; line-height: 16px; color: var(--ink-3);">No estamos afiliados a Valve ni a Steam.</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark","section":"Tema"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentDidMount() {
    var self = this;
    this.t1 = setTimeout(function () { self.setState({ play: true }); }, 120);
  }
  componentWillUnmount() { clearTimeout(this.t1); clearTimeout(this.t2); }
  renderVals() {
    var s = this.state || {};
    var self = this;
    var play = !!s.play;
    var instant = !!s.instant;
    function pose(base, end, start, dur, delay, ease) {
      var tr = instant ? 'none' : 'transform ' + dur + 'ms ' + ease + ' ' + delay + 'ms, opacity ' + Math.min(dur, 240) + 'ms ease ' + delay + 'ms';
      return base + ' transform: ' + (play ? end : start) + '; opacity: ' + (play ? 1 : 0) + '; transition: ' + tr + ';';
    }
    var settle = 'cubic-bezier(.2, 1.1, .3, 1)';
    var slap = 'cubic-bezier(.3, 1.5, .5, 1)';
    var rise = 'cubic-bezier(.2, .8, .2, 1)';
    var sticker = 'position: absolute; display: inline-flex; background: var(--deal); color: var(--on-deal); font-family: var(--font-display); font-weight: 800; border-radius: 6px; box-shadow: var(--shadow-sticker);';
    return {
      theme: this.props.theme ?? 'dark',
      c1: pose('position: absolute; left: 10px; top: 36px; width: 240px; height: 138px; box-sizing: border-box; border-radius: 16px; background: var(--surface-raised); border: 1px solid var(--line);', 'rotate(-6deg)', 'translateY(48px) rotate(2deg) scale(.96)', 560, 0, settle),
      c2: pose('position: absolute; right: 0; top: 0; width: 220px; height: 126px; box-sizing: border-box; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-card);', 'rotate(4deg)', 'translateY(48px) rotate(12deg) scale(.96)', 560, 90, settle),
      c3: pose('position: absolute; left: 44px; top: 132px; width: 270px; height: 154px; box-sizing: border-box; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-float);', 'rotate(0deg)', 'translateY(56px) rotate(-6deg) scale(.96)', 600, 180, settle),
      s1: pose(sticker + ' left: 30px; top: 116px; padding: 6px 8px 5px; font-size: 22px; line-height: 22px;', 'rotate(-8deg)', 'scale(1.8) rotate(8deg)', 380, 520, slap),
      s2: pose(sticker + ' right: 18px; top: 92px; padding: 6px 8px 5px; font-size: 20px; line-height: 20px;', 'rotate(5deg)', 'scale(1.8) rotate(20deg)', 380, 640, slap),
      s3: pose(sticker + ' left: 60px; top: 258px; padding: 9px 12px 8px; font-size: 40px; line-height: 40px;', 'rotate(-3deg)', 'scale(1.9) rotate(12deg)', 420, 780, slap),
      h1: pose('margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 42px; line-height: 42px; letter-spacing: 0.005em;', 'translateY(0)', 'translateY(14px)', 440, 900, rise),
      lead: pose('margin: 0; font-size: 15px; line-height: 22px; color: var(--ink-2);', 'translateY(0)', 'translateY(14px)', 440, 980, rise),
      cta: pose('display: flex; flex-direction: column; gap: 8px; margin-top: auto;', 'translateY(0)', 'translateY(14px)', 440, 1060, rise),
      replay: function () {
        clearTimeout(self.t1);
        clearTimeout(self.t2);
        self.setState({ play: false, instant: true });
        self.t2 = setTimeout(function () { self.setState({ play: true, instant: false }); }, 60);
      }
    };
  }
}
</script>
</body>
</html>
